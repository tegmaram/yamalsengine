name: Build and test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O2 -Isrc tests/core.cpp src/{maze,player}.cpp -o /tmp/test && /tmp/test
      - run: sha256sum -c shaders/manifest.sha256
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: ./build.ps1
